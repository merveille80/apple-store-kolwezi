<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:InterAE;font-weight:400;src:url(../fonts/Inter-Regular.otf)}
@font-face{font-family:InterAE;font-weight:500;src:url(../fonts/Inter-Medium.otf)}
@font-face{font-family:InterAE;font-weight:600;src:url(../fonts/Inter-SemiBold.otf)}
@font-face{font-family:InterAE;font-weight:700;src:url(../fonts/Inter-Bold.otf)}
@font-face{font-family:MonoAE;font-weight:500;src:url(../fonts/JetBrainsMono-Medium.ttf)}
@font-face{font-family:MonoAE;font-weight:600;src:url(../fonts/JetBrainsMono-SemiBold.ttf)}
@font-face{font-family:MonoAE;font-weight:700;src:url(../fonts/JetBrainsMono-Bold.ttf)}
body{margin:0;background:#333}
</style></head>
<body><canvas id="c"></canvas>
<script>
// Aperçu des données After Effects (data-*.js) : rendu approché des calques pour vérifier la mise en page
// avant la construction dans After Effects. Pas de flou de bougé.
const FONTS = {
  'Inter-Regular': ['InterAE', 400], 'Inter-Medium': ['InterAE', 500], 'Inter-SemiBold': ['InterAE', 600], 'Inter-Bold': ['InterAE', 700],
  'JetBrainsMono-Medium': ['MonoAE', 500], 'JetBrainsMono-SemiBold': ['MonoAE', 600], 'JetBrainsMono-Bold': ['MonoAE', 700],
};
var DATA = null, COMPS = {};
let TIME = 0;
const exprCtx = (time) => ({
  time, Math,
  seedRandom() {}, random(a = 0, b = 1) { return (a + b) / 2; },
  createPath(points, i, o, c) { return {v: points, i: points.map(() => [0, 0]), o: points.map(() => [0, 0]), c: !!c}; },
});
function evalExpr(x, time) {
  const ctx = exprCtx(time);
  const f = new Function(...Object.keys(ctx), '__x', 'return eval(__x);');

}
function val(spec, t, def) {
  if (spec === undefined || spec === null) return def;
  if (spec.x !== undefined) return evalExpr(spec.x, t);
  if (spec.k) {
    const k = spec.k;
    if (t <= k[0][0]) return k[0][1];
    if (t >= k[k.length - 1][0]) return k[k.length - 1][1];
    let i = 0;
    while (i < k.length - 1 && k[i + 1][0] <= t) i++;
    if (spec.h) return k[i][1];
    const a = k[i], b = k[i + 1], u = (t - a[0]) / (b[0] - a[0]);
    if (Array.isArray(a[1])) return a[1].map((x, j) => x + (b[1][j] - x) * u);

  }

}
const rgba = (c, o = 1) => `rgba(${Math.round(c[0] * 255)},${Math.round(c[1] * 255)},${Math.round(c[2] * 255)},${o})`;
const sc2 = (s) => (Array.isArray(s) ? s : [s, s]);

function applyTr(ctx, tr, t) {
  const a = val(tr && tr.a, t, [0, 0]), p = val(tr && tr.p, t, [0, 0]), s = sc2(val(tr && tr.s, t, 100)), r = val(tr && tr.r, t, 0);
  ctx.translate(p[0], p[1]);
  ctx.rotate((r * Math.PI) / 180);
  ctx.scale(s[0] / 100, s[1] / 100);
  ctx.translate(-a[0], -a[1]);
}
// Aplatissement d'un tracé (pour la coupe des tracés)
function flatten(path) {

  const segs = path.c ? n : n - 1;
  pts.push(path.v[0]);
  for (let s = 0; s < segs; s++) {
    const p0 = path.v[s], p3 = path.v[(s + 1) % n];
    const c1 = [p0[0] + path.o[s][0], p0[1] + path.o[s][1]], c2 = [p3[0] + path.i[(s + 1) % n][0], p3[1] + path.i[(s + 1) % n][1]];
    for (let j = 1; j <= 16; j++) {
      const u = j / 16, w = 1 - u;
      pts.push([w * w * w * p0[0] + 3 * w * w * u * c1[0] + 3 * w * u * u * c2[0] + u * u * u * p3[0], w * w * w * p0[1] + 3 * w * w * u * c1[1] + 3 * w * u * u * c2[1] + u * u * u * p3[1]]);
    }
  }
  return pts;
}
const plen = (pts) => pts.reduce((a, p, i) => (i ? a + Math.hypot(p[0] - pts[i - 1][0], p[1] - pts[i - 1][1]) : 0), 0);
function sub(pts, a, b) { // portion [a,b] en longueur
  const out = [];
  let acc = 0;
  for (let i = 1; i < pts.length; i++) {
    const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    const s0 = acc, s1 = acc + l;
    if (s1 >= a && s0 <= b && l > 0) {
      const u0 = Math.max(0, (a - s0) / l), u1 = Math.min(1, (b - s0) / l);
      const P = (u) => [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * u, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * u];
      if (!out.length) out.push(P(u0));
      out.push(P(u1));
    }
    acc = s1;
  }
  return out;
}
function geomOf(it, t) {
  if (it.ty === 'rect') {
    const s = val(it.s, t), p = val(it.p, t, [0, 0]), r = Math.min(val(it.r, t, 0), s[0] / 2, s[1] / 2);
    return {kind: 'rect', s, p, r};
  }
  if (it.ty === 'el') return {kind: 'el', s: val(it.s, t), p: val(it.p, t, [0, 0])};
  if (it.ty === 'sh') return {kind: 'path', path: it.x ? evalExpr(it.x, t) : it};
}
function tracePath(ctx, g, pts) {
  if (pts) { ctx.moveTo(pts[0][0], pts[0][1]); for (const q of pts.slice(1)) ctx.lineTo(q[0], q[1]); return; }
  if (g.kind === 'rect') { ctx.roundRect(g.p[0] - g.s[0] / 2, g.p[1] - g.s[1] / 2, g.s[0], g.s[1], g.r); return; }
  if (g.kind === 'el') { ctx.moveTo(g.p[0] + Math.abs(g.s[0] / 2), g.p[1]); ctx.ellipse(g.p[0], g.p[1], Math.abs(g.s[0] / 2), Math.abs(g.s[1] / 2), 0, 0, Math.PI * 2); return; }
  const p = g.path, n = p.v.length;
  ctx.moveTo(p.v[0][0], p.v[0][1]);
  const segs = p.c ? n : n - 1;
  for (let s = 0; s < segs; s++) {
    const p0 = p.v[s], p3 = p.v[(s + 1) % n];
    ctx.bezierCurveTo(p0[0] + p.o[s][0], p0[1] + p.o[s][1], p3[0] + p.i[(s + 1) % n][0], p3[1] + p.i[(s + 1) % n][1], p3[0], p3[1]);
  }
  if (p.c) ctx.closePath();
}
function drawGroup(ctx, items, t, opacity) {
  // éléments dans l'ordre de la pile AE (le premier est devant) : on dessine du dernier au premier
  const geoms = [];
  let trimSpec = null, rp = null;
  items.forEach((it) => {
    if (it.ty === 'rect' || it.ty === 'el' || it.ty === 'sh') geoms.push(geomOf(it, t));
    if (it.ty === 'tm') trimSpec = it;
    if (it.ty === 'rp') rp = it;
  });
  const copies = rp ? rp.n : 1, off = rp ? val(rp.p, t, [0, 0]) : [0, 0];
  const paints = items.filter((it) => it.ty === 'fl' || it.ty === 'st').reverse();
  const groups = items.filter((it) => it.ty === 'gr').reverse();
  for (let c = 0; c < copies; c++) {
    ctx.save();
    ctx.translate(off[0] * c, off[1] * c);
    for (const g of groups) {
      ctx.save();
      applyTr(ctx, g.tr, t);
      drawGroup(ctx, g.it, t, opacity * val(g.tr && g.tr.o, t, 100) / 100);
      ctx.restore();
    }
    // tracés éventuellement coupés
    let polys = null;
    if (trimSpec && geoms.length) {
      const s = val(trimSpec.s, t, 0) / 100, e = val(trimSpec.e, t, 100) / 100, o = (val(trimSpec.o, t, 0) / 360) % 1;
      const fl = geoms.map((g) => flatten(g.kind === 'path' ? g.path : {v: [], i: [], o: [], c: false}));
      polys = [];
      if (trimSpec.m === 2) {
        const lens = fl.map(plen), tot = lens.reduce((a, b) => a + b, 0);
        const ranges = [];
        let a0 = (s + o) * tot, b0 = (e + o) * tot;
        if (b0 > tot) { ranges.push([a0, tot], [0, b0 - tot]); } else ranges.push([a0, b0]);
        let acc = 0;
        fl.forEach((pts, i) => { ranges.forEach(([a, b]) => { const q = sub(pts, a - acc, b - acc); if (q.length > 1) polys.push(q); }); acc += lens[i]; });
      } else {
        fl.forEach((pts) => { const L = plen(pts); const q = sub(pts, (s + o) * L, (e + o) * L); if (q.length > 1) polys.push(q); });
      }
    }
    for (const pnt of paints) {
      const col = val(pnt.c, t), op = (val(pnt.o, t, 100) / 100) * opacity;
      if (op <= 0) continue;
      ctx.beginPath();
      if (polys) polys.forEach((q) => tracePath(ctx, null, q));
      else geoms.forEach((g) => tracePath(ctx, g));
      if (pnt.ty === 'fl') {
        ctx.fillStyle = rgba(col, op);
        ctx.fill(pnt.rule === 2 ? 'evenodd' : 'nonzero');
      } else {
        const w = val(pnt.w, t, 1);
        if (w <= 0) continue;
        ctx.strokeStyle = rgba(col, op);
        ctx.lineWidth = w;
        ctx.lineCap = pnt.cap === 2 ? 'round' : 'butt';
        ctx.lineJoin = pnt.join === 2 ? 'round' : 'miter';
        ctx.setLineDash(pnt.dash || []);
        ctx.lineDashOffset = val(pnt.doff, t, 0);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }
    ctx.restore();
  }
}
const GL = 'ABCDEFGHKMNPRSTUVXYZ0123456789#/<>_';
function drawText(ctx, L, t) {
  const [fam, w] = FONTS[L.font];
  ctx.font = `${w} ${L.size}px ${fam}`;
  ctx.letterSpacing = `${(L.tracking / 1000) * L.size}px`;
  let color = L.color;
  if (L.colorKeys) L.colorKeys.forEach(([kt, c]) => { if (t >= kt - 1e-6) color = c; });

  const chars = [...str];
  let started = chars.length, done = chars.length, typed = chars.length;
  if (L.decode) {
    const d = L.decode;
    const cnt = (t0) => { const x = (t - t0) / d.st; return x < -1e-6 ? 0 : Math.min(d.n, Math.floor(x + 1e-6) + 1); };
    started = cnt(d.t0); done = cnt(d.t0 + d.d);
  }
  if (L.appear) typed = val(L.appear, t);
  let x = 0;
  chars.forEach((ch, i) => {
    let c = ch, col = color;
    const hidden = i >= started || i >= typed;
    if (!hidden && i >= done && ch !== ' ') { c = GL[(Math.floor(t * 36) * 13 + i * 7) % GL.length]; if (L.decode.c) col = L.decode.c; }
    if (!hidden) { ctx.fillStyle = rgba(col); ctx.fillText(c, x, 0); }
    x += ctx.measureText(ch).width;
  });
}
function layerMatrix(ctx, comp, L, t) {
  if (L.parent) layerMatrix(ctx, comp, comp.byName[L.parent], t);
  applyTr(ctx, L.tr, t);
}
function drawLayer(ctx, comp, L, t) {
  if (t < L.in - 1e-6 || t >= L.out - 1e-6) return;
  const op = val(L.tr && L.tr.o, t, 100) / 100;
  if (op <= 0) return;
  const W = DATA.w, H = DATA.h;
  const off = new OffscreenCanvas(ctx.canvas.width, ctx.canvas.height);
  const o = off.getContext('2d');
  o.setTransform(ctx.getTransform());
  if (L.type === 'solid') { o.fillStyle = rgba(L.color); o.fillRect(0, 0, W, H); }
  else if (L.type === 'comp') drawComp(o, COMPS[L.ref], t);
  else {
    layerMatrix(o, comp, L, t);
    if (L.type === 'shape') drawGroup(o, L.c, t, 1);
    if (L.type === 'text') drawText(o, L, t);
  }
  if (L.matte) {
    const M = comp.byName[L.matte];
    if (t >= M.in - 1e-6 && t < M.out - 1e-6) {
      const mc = new OffscreenCanvas(ctx.canvas.width, ctx.canvas.height);
      const m = mc.getContext('2d');
      m.setTransform(ctx.getTransform());
      layerMatrix(m, comp, M, t);
      drawGroup(m, M.c, t, 1);
      o.setTransform(1, 0, 0, 1, 0, 0);
      o.globalCompositeOperation = 'destination-in';
      o.drawImage(mc, 0, 0);

  }
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = op;
  const k = ctx.canvas.width / W;

    if (f.t === 'blur') { const b = val(f.v, t, 0); if (b > 0.01) filt.push(`blur(${(b / 2) * k}px)`); }
    if (f.t === 'glow') filt.push(`drop-shadow(0px ${f.dist * k}px ${f.soft * k * 0.5}px ${rgba(f.c, f.o)})`);

  ctx.drawImage(off, 0, 0);
  ctx.restore();
}
function drawComp(ctx, comp, t) {
  comp.layers.forEach((L) => { if (!L.matteOnly && L.type !== 'audio') drawLayer(ctx, comp, L, t); });
}
async function load(src) {
  await new Promise((res) => { const s = document.createElement('script'); s.src = src; s.onload = res; document.head.appendChild(s); });
  DATA = window.DATA;
  DATA.comps.forEach((c) => { c.byName = {}; c.layers.forEach((L) => (c.byName[L.name] = L)); COMPS[c.name] = c; });
  const fams = Object.values(FONTS).map(([f, w]) => document.fonts.load(`${w} 40px ${f}`, 'Aé→'));

}
function render(t, scale = 0.25) {
  const c = document.getElementById('c');
  c.width = Math.round(DATA.w * scale);
  c.height = Math.round(DATA.h * scale);
  const ctx = c.getContext('2d');
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawComp(ctx, COMPS[DATA.main], t);
  return c.toDataURL('image/png');
}
</script></body></html>
